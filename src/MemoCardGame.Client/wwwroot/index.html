<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <meta name="description" content="Play Memo Card Game in your browser with pictures or sounds. Choose a mode, pick a board size, and have fun." />
    <link rel="canonical" href="https://memocardgame.vercel.app/" />

    <!-- Social preview image for picture and sound gameplay. -->
    <!-- Open Graph (Facebook, LinkedIn, Discord, iMessage, etc.) - crawlers read this static HTML; use absolute URLs -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:site_name" content="Memo Card Game" />
    <meta property="og:title" content="Memo Card Game - pictures or sounds" />
    <meta property="og:description" content="Play Memo Card Game in your browser with pictures or sounds. Choose a mode, pick a board size, and have fun." />
    <meta property="og:url" content="https://memocardgame.vercel.app/" />
    <meta property="og:image" content="https://memocardgame.vercel.app/og-image-picture-sound.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Memo Card Game: match pairs with pictures or sounds in the browser" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Memo Card Game - pictures or sounds" />
    <meta name="twitter:description" content="Play Memo Card Game in your browser with pictures or sounds. Choose a mode, pick a board size, and have fun." />
    <meta name="twitter:image" content="https://memocardgame.vercel.app/og-image-picture-sound.png" />
    <meta name="twitter:image:alt" content="Memo Card Game: match pairs with pictures or sounds in the browser" />

    <meta name="theme-color" content="#0f172a" />
    <meta name="color-scheme" content="dark" />
    <base href="/" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <!-- API host (must match wwwroot/appsettings.Production.json ApiBaseUrl) - saves TLS handshake on first game request -->
    <link rel="preconnect" href="https://pexeso.ff0000.cz" crossorigin />
    <link rel="dns-prefetch" href="https://cdn.jsdelivr.net" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Sora:wght@600;700&display=swap" rel="stylesheet" />
    <link rel="preload" href="_framework/blazor.webassembly.js" as="script" />
    <link rel="stylesheet" href="css/app.css" />
</head>
<body>
    <div id="app">
        <div class="loading">Loading...</div>
    </div>
    <script>
        window.memoCookies = window.memoCookies || {
            get: function (name) {
                var m = document.cookie.match(new RegExp('(?:^|; )' + name.replace(/([.$?*|{}()[\]\\/+^])/g, '\\$1') + '=([^;]*)'));
                return m ? decodeURIComponent(m[1]) : '';
            },
            set: function (name, value, days) {
                var maxAge = Math.floor(days * 24 * 60 * 60);
                document.cookie = name + '=' + encodeURIComponent(value) + ';path=/;max-age=' + maxAge + ';SameSite=Lax';
            }
        };
        window.memoAudio = window.memoAudio || {
            _cache: new Map(),
            play: function (src) {
                if (!src) return;
                let audio = this._cache.get(src);
                if (!audio) {
                    audio = new Audio(src);
                    audio.preload = "auto";
                    this._cache.set(src, audio);
                }
                audio.currentTime = 0;
                audio.play().catch(function () { });
            }
        };
        window.memoCarousel = window.memoCarousel || {
            enablePointerCapture: function (el) {
                if (!el || el.__memoPointerCaptureBound) return;

                const capture = function (event) {
                    if (!event || typeof el.setPointerCapture !== "function") return;
                    try { el.setPointerCapture(event.pointerId); } catch (_) { }
                };

                const release = function (event) {
                    if (!event || typeof el.releasePointerCapture !== "function") return;
                    try {
                        if (typeof el.hasPointerCapture === "function" && !el.hasPointerCapture(event.pointerId)) return;
                        el.releasePointerCapture(event.pointerId);
                    } catch (_) { }
                };

                el.addEventListener("pointerdown", capture);
                el.addEventListener("pointerup", release);
                el.addEventListener("pointercancel", release);
                el.__memoPointerCaptureBound = true;
            }
        };
    </script>
    <script src="_framework/blazor.webassembly.js"></script>
</body>
</html>
